{% extends 'base.html' %}

{% block title %}{{ xml_game.title }}{% endblock %}

{% block content %}
<img src="{{ xml_game.thumbnail }}">
<h1>{{ xml_game.title }}</h1>
<p><strong>Players:</strong> {{ xml_game.min_players }} - {{ xml_game.max_players }}</p>
<p><strong>Minimum age:</strong> {{ xml_game.min_age }}</p>
<p><strong>Description:</strong> {{ xml_game.description }}</p>
{% endblock %}
