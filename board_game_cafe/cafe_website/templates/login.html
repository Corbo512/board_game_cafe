{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Loggin in? Great!</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}
        {% for error in field.errors %}
        {{ error }}
        {% endfor %}
    {% endif %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <input type="submit" value="Sign in" name="Login User">
</form>
{% endblock %}
